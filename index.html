<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню Интурист 2026</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0; padding: 15px; background: #1a1a1a; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center; user-select: none;
  }
  .tap-zone { position: fixed; inset: 0; z-index: 9999; cursor: pointer; }
  .menu-container { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 0 auto; pointer-events: none; }
  .block { background: #222; border: 2px solid #d4af37; border-radius: 12px; padding: 12px; text-align: center; }
  .block-title { font-size: 20px; font-weight: bold; color: #d4af37; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
  .block-items { font-size: 14px; color: #ccc; line-height: 1.4; }
  .status { margin-top: 15px; text-align: center; color: #4dabf7; font-size: 16px; font-weight: bold; pointer-events: none; min-height: 24px; }
</style>
</head>
<body>

<div class="tap-zone" id="tapZone"></div>
<div class="menu-container" id="menuContainer"></div>
<div class="status" id="status">Загрузка...</div>

<script>
  // === ПОЛНОЕ МЕНЮ ===
  const menuData = {
    "Завтрак": [
      { name: "Каша овсяная Тирамису", price: 750 }, { name: "Рисовая каша с копченой грушей", price: 750 },
      { name: "Кукурузная каша с пюре из манго и ягодами", price: 650 }, { name: "Омлет с крабом", price: 1100 },
      { name: "Омлет четыре сыра", price: 990 }, { name: "Омлет с ветчиной и беконом", price: 690 },
      { name: "Драники из цукини с лососем", price: 690 }, { name: "Скрембл на бриоше с авокадо и лососем", price: 890 },
      { name: "Яичница с беконом", price: 480 }, { name: "Хрустящие яйца", price: 540 },
      { name: "Брускетта с авокадо и яйцом пашот", price: 590 }, { name: "Сырники с рикоттой", price: 750 },
      { name: "Блины классические", price: 350 }
    ],
    "Добавки": [
      { name: "Красная икра / Щучья икра со сметаной", price: 500 },
      { name: "Соус ягодный / Сметана / Мед / Кленовый сироп / Сгущенное молоко", price: 250 },
      { name: "Сыр страчателла", price: 300 }
    ],
    "Закуски": [
      { name: "Тала из осетра", price: 2400 }, { name: "Сырная тарелка", price: 1950 },
      { name: "Мясное плато из сыровялов", price: 1950 }, { name: "Ассорти из мини эклеров", price: 840 },
      { name: "Баклажаны Интурист", price: 740 }, { name: "Сельдь собственного посола", price: 740 },
      { name: "Битые огурцы", price: 350 }, { name: "Овощные соленья", price: 590 },
      { name: "Икра щучья в рожках", price: 730 }, { name: "Икра красная", price: 1650 }
    ],
    "Салаты": [
      { name: "Салат с семгой, гребешком и рукколой", price: 1200 }, { name: "Буратта с томатами", price: 890 },
      { name: "Салат Дальневосточный с говядиной", price: 890 }, { name: "Салат Оливье с языком", price: 790 },
      { name: "Салат Мимоза с семгой", price: 790 }, { name: "Папоротник с говядиной", price: 780 },
      { name: "Салат с баклажанами", price: 680 }, { name: "Овощной салат из дальневосточных помидоров", price: 560 },
      { name: "Микс с куриной грудкой", price: 850 }, { name: "Микс с креветкой", price: 980 }
    ],
    "Супы": [
      { name: "Том Ям", price: 1200 }, { name: "Уха из амурской рыбы", price: 990 },
      { name: "Крем суп из сельдерея", price: 970 }, { name: "Куриный бульон с яйцом пашот", price: 650 },
      { name: "Борщ с говядиной и пампушкой", price: 780 }, { name: "Суп сырный в хлебной тарелке", price: 680 },
      { name: "Хлебная корзинка", price: 350 }, { name: "Хлебная корзинка Бородино", price: 350 }
    ],
    "Основной курс": [
      { name: "Оленина с кедровой кашей", price: 2300 }, { name: "Мясной рулет Бернуазет", price: 2100 },
      { name: "Бургер таежный из оленины", price: 1300 }, { name: "Миньон со шпинатом и фуагра", price: 2100 },
      { name: "Телячьи щечки с картофельным пюре", price: 980 }, { name: "Язык говяжий с картофельным пюре", price: 1100 },
      { name: "Щучьи котлеты со сливочным орзо", price: 980 }, { name: "Куриная грудка со шпинатом", price: 950 },
      { name: "Лосось с соусом чимичурри и спаржей", price: 1800 }, { name: "Палтус в сиропе саган-дайля и печенью трески", price: 1900 },
      { name: "Чахан с морепродуктами", price: 750 }
    ],
    "Лепка": [
      { name: "Таежные пельмени с олениной", price: 1200 }, { name: "Пельмени с чернилами каракатицы", price: 1250 },
      { name: "Пельмени Интурист в горшочке", price: 780 }, { name: "Вареники с картофелем и беконом", price: 580 },
      { name: "Вареники с капустой", price: 580 }, { name: "Вареники с творогом", price: 580 }
    ],
    "Пицца": [
      { name: "Ветчина и грибы", price: 740 }, { name: "Четыре сыра", price: 880 },
      { name: "Мясная", price: 840 }, { name: "Том Ям", price: 990 },
      { name: "Пепперони", price: 680 }, { name: "Грибная", price: 730 },
      { name: "Деревенская", price: 740 }, { name: "Маргарита", price: 690 }
    ],
    "Десерты": [
      { name: "Груша в миндальном финансье", price: 950 }, { name: "Павлова на бисквите", price: 630 },
      { name: "Меренговый рулет", price: 580 }, { name: "Торт Медовый", price: 540 },
      { name: "Торт Наполеон", price: 540 }, { name: "Черничный пирог", price: 540 },
      { name: "Семифредо", price: 540 }, { name: "Мороженое или Сорбеты", price: 350 }
    ],
    "Гарниры": [
      { name: "Батат фри с сыром пармезан", price: 680 }, { name: "Овощи гриль", price: 600 },
      { name: "Капуста цветная и брокколи", price: 400 }, { name: "Картофельное пюре", price: 400 },
      { name: "Картофель запеченный айдахо", price: 400 }, { name: "Картофель фри", price: 400 },
      { name: "Рис отварной", price: 400 }
    ]
  };

  let flatMenu = [];
  let categoryNames = []; // Список названий разделов
  
  for (let section in menuData) {
    categoryNames.push(section);
    for (let item of menuData[section]) {
      flatMenu.push({ ...item, category: section });
    }
  }

  let currentIndex = 0;
  let currentCategoryIndex = 0;
  let isSpeaking = false;
  let sessionId = 0;
  
  const synth = window.speechSynthesis;

  function renderMenu() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';
    for (let section in menuData) {
      const block = document.createElement('div');
      block.className = 'block';
      block.innerHTML = `<div class="block-title">${section}</div>
                         <div class="block-items">${menuData[section].map(i => i.name).join(', ')}</div>`;
      container.appendChild(block);
    }
  }

  function speak(text, onEndCallback) {
    if (!synth) return;
    synth.cancel(); 
    isSpeaking = true;
    
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = 1.0;
    u.onend = () => {
      isSpeaking = false;
      if (onEndCallback) onEndCallback();
    };
    synth.speak(u);
  }

  // Прочитать текущее блюдо
  function readCurrentDish() {
    sessionId++;
    const item = flatMenu[currentIndex];
    document.getElementById('status').textContent = `${item.category}: ${item.name}`;
    speak(`${item.category}. ${item.name}, ${item.price} рублей.`);
  }

  // Перейти к следующему блюду
  function readNext() {
    sessionId++;
    currentIndex++;
    if (currentIndex >= flatMenu.length) currentIndex = 0; 
    
    const item = flatMenu[currentIndex];
    document.getElementById('status').textContent = `Следующее: ${item.category} - ${item.name}`;
    speak(`${item.category}. ${item.name}, ${item.price} рублей.`);
  }

  // ПЕРЕЙТИ К СЛЕДУЮЩЕМУ РАЗДЕЛУ (НОВАЯ ФУНКЦИЯ)
  function nextCategory() {
    sessionId++;
    
    // Находим текущий раздел и переключаемся на следующий по кругу
    const currentItem = flatMenu[currentIndex];
    let currentCatIdx = categoryNames.indexOf(currentItem.category);
    let nextCatIdx = (currentCatIdx + 1) % categoryNames.length;
    
    const nextCatName = categoryNames[nextCatIdx];
    
    // Находим первое блюдо в новом разделе
    const newIndex = flatMenu.findIndex(item => item.category === nextCatName);
    if (newIndex !== -1) {
      currentIndex = newIndex;
      const item = flatMenu[currentIndex];
      document.getElementById('status').textContent = `Раздел: ${nextCatName}`;
      speak(`Раздел ${nextCatName}. ${item.name}, ${item.price} рублей.`);
    }
  }

  // === УМНАЯ ОБРАБОТКА ТАПОВ ===
  let tapCount = 0;
  let tapTimer = null;

  document.getElementById('tapZone').addEventListener('click', () => {
    // Если робот говорит, любой тап просто останавливает его
    if (isSpeaking) {
      sessionId++;
      synth.cancel();
      isSpeaking = false;
      document.getElementById('status').textContent = "Остановлено.";
      return; 
    }

    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);

    // Ждем 400 мс после последнего тапа, чтобы понять, сколько их было
    tapTimer = setTimeout(() => {
      if (tapCount === 1) {
        readCurrentDish(); // 1 тап: прочитать текущее
      } else if (tapCount === 2) {
        readNext(); // 2 тапа: следующее блюдо
      } else if (tapCount >= 3) {
        nextCategory(); // 3 тапа: следующий раздел!
      }
      tapCount = 0;
    }, 400);
  });

  // Запуск
  renderMenu();
  
  setTimeout(() => {
    speak("Меню Интурист. Один тап: прочитать блюдо. Два тапа: следующее блюдо. Три тапа: перейти в следующий раздел.");
    document.getElementById('status').textContent = "1 тап - блюдо, 2 тапа - след, 3 тапа - раздел.";
  }, 500);

</script>
</body>
</html>
