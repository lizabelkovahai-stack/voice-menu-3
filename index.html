<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню Интурист</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0; padding: 15px; background: #1a1a1a; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center; user-select: none;
  }
  .tap-zone { position: fixed; inset: 0; z-index: 9999; cursor: pointer; }
  .menu-container { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; pointer-events: none; }
  .block { background: #222; border: 2px solid #d4af37; border-radius: 12px; padding: 15px; text-align: center; }
  .block-title { font-size: 22px; font-weight: bold; color: #d4af37; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
  .block-items { font-size: 16px; color: #ccc; line-height: 1.4; }
  .status { margin-top: 20px; text-align: center; color: #4dabf7; font-size: 16px; font-weight: bold; pointer-events: none; min-height: 24px; }
</style>
</head>
<body>

<div class="tap-zone" id="tapZone"></div>
<div class="menu-container" id="menuContainer"></div>
<div class="status" id="status">Загрузка...</div>

<script>
  const menuData = {
    "Завтрак": [
      { name: "Каша овсяная Тирамису", price: 750 },
      { name: "Рисовая каша с копченой грушей", price: 750 },
      { name: "Кукурузная каша с пюре манго", price: 650 },
      { name: "Омлет с крабом", price: 1100 },
      { name: "Омлет четыре сыра", price: 990 },
      { name: "Омлет с ветчиной и беконом", price: 690 },
      { name: "Драники из цукини с лососем", price: 690 },
      { name: "Скрембл на бриоше с авокадо и лососем", price: 890 }
    ],
    "Салаты": [
      { name: "Салат с семгой и гребешком", price: 1200 },
      { name: "Буратта с томатами", price: 890 },
      { name: "Салат Дальневосточный с говядиной", price: 890 },
      { name: "Салат Оливье с языком", price: 790 },
      { name: "Салат Мимоза с семгой", price: 790 },
      { name: "Папоротник с говядиной", price: 780 }
    ],
    "Супы": [
      { name: "Том Ям", price: 1200 },
      { name: "Уха из амурской рыбы", price: 990 },
      { name: "Крем суп из сельдерея", price: 970 },
      { name: "Куриный бульон с яйцом пашот", price: 650 },
      { name: "Борщ с говядиной и пампушкой", price: 780 },
      { name: "Суп сырный в хлебной тарелке", price: 680 }
    ]
  };

  let flatMenu = [];
  for (let section in menuData) {
    for (let item of menuData[section]) {
      flatMenu.push({ ...item, category: section });
    }
  }

  let isSpeaking = false;
  let isReadingAll = false; 
  let currentIndex = 0;
  let micShouldBeOn = false; 
  
  const synth = window.speechSynthesis;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  function renderMenu() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';
    for (let section in menuData) {
      const block = document.createElement('div');
      block.className = 'block';
      block.innerHTML = `<div class="block-title">${section}</div>
                         <div class="block-items">${menuData[section].map(i => i.name).join(', ')}</div>`;
      container.appendChild(block);
    }
  }

  function speak(text, onEndCallback) {
    if (!synth) return;
    synth.cancel(); 
    isSpeaking = true;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = 1.0;
    u.onend = () => {
      isSpeaking = false;
      if (onEndCallback) onEndCallback();
    };
    synth.speak(u);
  }

  function readAll() {
    isReadingAll = true;
    currentIndex = 0;
    micShouldBeOn = true; 
    startListening();
    readCurrentDish();
  }

  function readCurrentDish() {
    if (!isReadingAll || currentIndex >= flatMenu.length) {
      isReadingAll = false;
      micShouldBeOn = false;
      speak("Конец меню. Нажмите два раза для заказа.");
      return;
    }
    const item = flatMenu[currentIndex];
    // Небольшая пауза перед чтением, чтобы микрофон успел включиться
    speak(`${item.category}. ${item.name}, ${item.price} рублей.`, () => {
      if (isReadingAll) {
        currentIndex++;
        setTimeout(readCurrentDish, 300); // Пауза 0.3 сек
      }
    });
  }

  function nextDishVoice() {
    isReadingAll = true;
    currentIndex++;
    if (currentIndex >= flatMenu.length) currentIndex = 0;
    synth.cancel(); // Обрываем робота
    readCurrentDish(); 
  }

  function takeOrder() {
    isReadingAll = false;
    micShouldBeOn = true;
    startListening();
    speak("Выберите блюдо. Говорите.");
  }

  function findDish(spokenText) {
    let bestMatch = null;
    let maxMatches = 0;
    const spokenWords = spokenText.toLowerCase().split(' ').filter(w => w.length > 2);
    for (let category in menuData) {
      for (let item of menuData[category]) {
        const itemWords = item.name.toLowerCase().replace(/[^а-яё\s]/g, '').split(' ').filter(w => w.length > 2);
        let matches = 0;
        for (let w of spokenWords) {
          if (itemWords.some(iw => iw.includes(w) || w.includes(iw))) matches++;
        }
        if (matches > maxMatches) {
          maxMatches = matches;
          bestMatch = { ...item, category };
        }
      }
    }
    return maxMatches > 0 ? bestMatch : null;
  }

  if (SR) {
    recognition = new SR();
    recognition.lang = 'ru-RU';
    recognition.interimResults = true; // ВАЖНО: ловим слова на лету
    recognition.maxAlternatives = 1;
    
    recognition.onstart = () => { 
      document.getElementById('status').textContent = "Слушаю..."; 
    };
    
    recognition.onend = () => {
      // Принудительно перезапускаем микрофон, если он нужен
      if (micShouldBeOn) {
        setTimeout(() => {
          try { recognition.start(); } catch(e) {}
        }, 200);
      } else {
        document.getElementById('status').textContent = "Ожидание...";
      }
    };
    
    recognition.onresult = (event) => {
      const t = event.results[0][0].transcript.toLowerCase().trim();
      
      // Показываем на экране, что услышал робот (чтобы проверить)
      document.getElementById('status').textContent = `Услышала: "${t}"`;
      
      // Проверяем команду "Дальше" (очень мягкий поиск)
      if (t.includes('дал') || t.includes('след') || t.includes('далее')) {
        nextDishVoice();
        return;
      }

      // Если мы ждем заказ, ищем блюдо
      if (!isReadingAll) {
        const dish = findDish(t);
        if (dish) {
          micShouldBeOn = false; 
          synth.cancel(); 
          speak("Заказ принят. Вы выбрали " + dish.name + " из раздела " + dish.category + ".");
          document.getElementById('status').textContent = "Заказ принят!";
        }
      }
    };
  }

  function startListening() {
    if (recognition && micShouldBeOn) {
      try { recognition.start(); } catch(e) {}
    }
  }

  let tapCount = 0;
  let tapTimer = null;

  document.getElementById('tapZone').addEventListener('click', () => {
    if (isSpeaking) {
      synth.cancel();
      isSpeaking = false;
      isReadingAll = false; 
      micShouldBeOn = false;
      document.getElementById('status').textContent = "Остановлено.";
      return;
    }

    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);

    tapTimer = setTimeout(() => {
      if (tapCount === 1) {
        readAll(); 
      } else if (tapCount >= 2) {
        takeOrder(); 
      }
      tapCount = 0;
    }, 400);
  });

  renderMenu();
  // Приветствие
  setTimeout(() => {
    speak("Меню Интурист. Один тап - слушать. Два тапа - заказ. Скажите 'Дальше' чтобы листать.");
  }, 500);

</script>
</body>
</html>
